# =====================================================================
# application.properties - Employee Payroll App
# =====================================================================

spring.application.name=EmployeePaymentRollApp
server.port=8080


spring.datasource.url=jdbc:h2:mem:payrolldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=himanshu@123


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---------------------
# H2 Console (browser UI)
# Visit: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:payrolldb
# ---------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


logging.level.com.payroll=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
