# ── UC6: Labels/Tags Management ──────────────────────────────────────────

# ── DataSource ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes_uc6?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────
# Must be >= 256 bits (32 chars) for HMAC-SHA256
jwt.secret=fundoo-notes-uc6-super-secret-key-minimum-32-chars!!
jwt.expiration-ms=86400000

# ── App ───────────────────────────────────────────────────────────────────
spring.application.name=fundoo-notes-uc6
server.port=8080
