#  Fundoo Notes — Application Configuration
#  Use Case 3: Authorization Filter + Protecting Endpoints

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── DataSource ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=himanshu@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool (HikariCP defaults are fine; shown here for clarity) ──
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──────────────────────────────────────────
# UC3: "update" creates / alters tables automatically.
# Switch to "validate" in UC16 once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Logging ──────────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.fundoo=DEBUG

# ── Actuator (optional smoke-test) ──────────────────────────
# management.endpoints.web.exposure.include=health,info

# ── JWT ──────────────────────────────────────────────────────
# Secret must be ≥ 32 chars (256 bits) for HS256.
# Change this to a strong random value in production!
app.jwt.secret=FundooNotes-Super-Secret-Key-2024-ChangeInProd!
app.jwt.expiration-ms=86400000
