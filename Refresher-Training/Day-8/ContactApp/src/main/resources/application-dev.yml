# =====================================================================
# application-dev.yml  — Development profile
# Uses H2 in-memory database; Swagger and H2 console both enabled.
# Activate with:  --spring.profiles.active=dev
# =====================================================================

spring:
  datasource:
    url: jdbc:h2:mem:contactdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: admin123

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop      # Drop & recreate schema on every restart
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console            # Visit http://localhost:8080/h2-console

# Verbose logging in dev
logging:
  level:
    com.contactapp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
