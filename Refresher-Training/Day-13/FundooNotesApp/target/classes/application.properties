# ========================================
# FundooNotesApp - Application Properties
# ========================================

spring.application.name=FundooNotesApp

# Server port (8081 to avoid conflict with ContactApp on 8080)
server.port=8081

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:fundoodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=fundoo-notes-super-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expirationMillis=3600000
